syntax = "proto3";

// Minimal Fireworks control-plane gateway slice.
// Field numbers verified against live gateway.fireworks.ai responses.
package gateway;

message Money {
  string currency_code = 1;
  int64 units = 2;
  int32 nanos = 3;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Balance {
  Money money = 1;
}

message GetBalanceRequest {
  string name = 1; // "accounts/<account_id>"
}

message Account {
  string name = 1;
  string display_name = 2;
  string email = 9;
  // state is an enum (READY=2, …); decode as int32
  int32 state = 7;
}

message ListAccountsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message GetAccountUsageRequest {
  string name = 1;
  Timestamp start_time = 2;
  Timestamp end_time = 3;
  UsageType usage_type = 4;
  string timezone = 5;
  repeated string group_by = 6;
  repeated string filter = 7;

  enum UsageType {
    ALL = 0;
    SERVERLESS = 1;
    DEDICATED_DEPLOYMENT = 2;
    TRAINING = 3;
  }
}

message ServerlessCost {
  string model_name = 1;
  int64 prompt_tokens = 2;
  int64 completion_tokens = 3;
  Timestamp start_time = 4;
  Timestamp end_time = 5;
  string usage_type = 7;
  map<string, string> group = 9;
  int64 cached_prompt_tokens = 10;
  int64 uncached_prompt_tokens = 11;
}

message GetAccountUsageResponse {
  repeated ServerlessCost serverless_costs = 1;
}

message ListQuotasRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message Quota {
  string name = 1;
  int64 value = 2;
  int64 max_value = 3;
  // usage omitted when 0; present as field 5 when non-zero on some accounts
  int64 usage = 5;
}

message ListQuotasResponse {
  repeated Quota quotas = 1;
}

message GetBillingSummaryRequest {
  string name = 1;
  Timestamp start_time = 2;
  Timestamp end_time = 3;
  int32 granularity = 4;
}

message LineItem {
  string category = 1;
  string grouping_key = 2;
  string grouping_value = 3;
  Money unit_amount = 7;
  Money total_cost = 8;
}

message GetBillingSummaryResponse {
  repeated LineItem line_items = 1;
}

service Gateway {
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetBalance(GetBalanceRequest) returns (Balance);
  rpc GetAccountUsage(GetAccountUsageRequest) returns (GetAccountUsageResponse);
  rpc ListQuotas(ListQuotasRequest) returns (ListQuotasResponse);
  rpc GetBillingSummary(GetBillingSummaryRequest) returns (GetBillingSummaryResponse);
}
